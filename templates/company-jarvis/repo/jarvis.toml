[project]
name = "{{COMPANY_JARVIS_NAME}}"
slug = "{{COMPANY_SLUG}}"
description = "{{COMPANY_NAME}} 企业 agent 统一入口——知识索引、路由、综合与写回中枢"

[identity]
company = "{{COMPANY_NAME}}"
product = "{{PRODUCT_IDENTITY}}"
owner = "{{COMPANY_OWNER}}"

[runtime]
root = "{{RUNTIME_ROOT}}"
type = "jarvis-box"
entry_skill = "{{ENTRY_SKILL_PATH}}"

[vcs]
host = "{{VCS_HOST}}"

[bootstrap]
phase_status_file = "bootstrap-state.json"
result_file = "bootstrap-result.json"

[bootstrap.routing.discovery]
evidence_inventory = "_bootstrap/discovery/evidence-inventory.md"
module_coverage_matrix = "_bootstrap/discovery/module-coverage-matrix.md"
repo_role_map = "_bootstrap/discovery/repo-role-map.md"
workflow_map = "_bootstrap/discovery/workflow-map.md"
generation_plan = "_bootstrap/discovery/generation-plan.md"

[bootstrap.routing.modules]
plan_pointer = "_bootstrap/discovery/generation-plan.md"

[bootstrap.routing.sources]
plan_pointer = "_bootstrap/discovery/generation-plan.md"

[bootstrap.routing.repos]
plan_pointer = "_bootstrap/discovery/repo-role-map.md"

[bootstrap.routing.workflows]
plan_pointer = "_bootstrap/discovery/workflow-map.md"
